[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "home-staff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["matrix-nio", "aiohttp", "claude-agent-sdk"]

[project.scripts]
frontdesk = "staff.frontdesk:main"
staff-worker = "staff.worker:main"
staff-relay = "staff.relay:main"
staff-door = "staff.door:main"

[tool.setuptools]
packages = ["staff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
